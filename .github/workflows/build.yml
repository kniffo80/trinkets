name: Build

# Läuft auf jedem Branch- und jedem PR-Push — Ports wie `26.3` sollen ohne Merge nach
# `main` weiterarbeiten können. Der `branches`-Filter hält Tag-Pushes draußen: die
# löst nur release.yml aus (siehe dort).
on:
  push:
    branches: ['**']
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # JDK 26: gradle/gradle-daemon-jvm.properties verlangt toolchainVersion=26,
      # kompiliert wird mit release=25 (siehe build.gradle).
      - name: JDK einrichten
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '26'

      - name: Gradle einrichten
        uses: gradle/actions/setup-gradle@v4

      - name: Bauen
        run: ./gradlew build

      # Der Branch steht im Artefaktnamen, die Minecraft-Version auch: bei mehreren
      # parallelen Ports (26.1.2, 26.3, …) sieht man sonst nicht, was in der JAR steckt.
      - name: Minecraft-Version aus gradle.properties lesen
        id: mc
        run: echo "version=$(sed -n 's/^minecraft_version=//p' gradle.properties)" >> "$GITHUB_OUTPUT"

      - name: Mod-JAR als Artefakt hochladen
        uses: actions/upload-artifact@v4
        with:
          name: mc${{ steps.mc.outputs.version }}-trinkets-${{ github.sha }}
          path: build/libs/*.jar
          retention-days: 14
